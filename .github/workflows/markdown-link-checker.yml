name: Markdown Link Checker
on:
  workflow_dispatch:


jobs:
  markdown-link-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for path filtering on PRs
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            markdown:
              - '**.md'
      - name: Run linkspector
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.markdown == 'true'
        uses: umbrelladocs/action-linkspector@v1
        with:
          fail_on_error: true
