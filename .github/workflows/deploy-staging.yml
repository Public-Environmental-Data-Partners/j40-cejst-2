name: Build and Deploy to staging (AWS)
on:
  pull_request:
    branches:
      - main
    paths:
      # Include all client files
      - "client/**/*"
      # Exclude markdown files - workflow will skip if ONLY markdown files change
      # Note: If mixed changes (code + markdown), workflow still runs due to code changes
      - "!client/**/*.md"
env:
  PR_NUMBER: ${{github.event.pull_request.number}}
  WORKING_DIRECTORY: ./client
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      destination-folder: ${{ steps.set-destination.outputs.destination-folder }}
    steps:
      - name: Set DESTINATION_FOLDER for branch
        id: set-destination
        run: |
          PR_COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          DESTINATION_FOLDER=$(echo ${{ env.PR_NUMBER }}-$PR_COMMIT_SHA | cut -c 1-11)
          echo "destination-folder=$DESTINATION_FOLDER" >> $GITHUB_OUTPUT
          echo "The head commit SHA of the PR is: $PR_COMMIT_SHA"
          echo "Destination folder will be: $DESTINATION_FOLDER"

  build:
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present
        env:
          # See the client readme for more info on environment variables:
          # https://github.com/usds/justice40-tool/blob/main/client/README.md
          DATA_SOURCE: cdn
          # SITE_URL: "${{ secrets.STAGE_SITE_URL }}"
          PATH_PREFIX: "/j40-cejst-2/pr-${{ needs.setup.outputs.destination-folder }}"
          # MAPBOX_STYLES_READ_TOKEN: "${{ secrets.MAPBOX_STYLES_READ_TOKEN }}"
      - name: Get directory contents
        run: ls -la public
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: client/public/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  lint:
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
        # Disabling for now due to jsonlint - TODO: put this back
      # - name: License Check
      #   run: npm run licenses

  translations:
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install
        run: npm ci
      - name: Spanish translation test
        run: npm run test:intl-translations

  deploy-s3:
    runs-on: ubuntu-latest
    needs: [setup, build, test, lint, translations]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: ./public
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}
      - name: Deploy to S3
        run: aws s3 sync ./public/ s3://pedp-cejst2-staging/j40-cejst-2/pr-${{ needs.setup.outputs.destination-folder }}/ --delete

  invalidate-cache:
    runs-on: ubuntu-latest
    needs: [setup, deploy-s3]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}
      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/j40-cejst-2/pr-${{ needs.setup.outputs.destination-folder }}/*"

  comment-pr:
    runs-on: ubuntu-latest
    needs: [setup, invalidate-cache]
    permissions:
      pull-requests: write
    steps:
      - name: Update PR with deployed URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            **🚢  Here is the preview deployment link: 🚢**   
            Find it here: https://dcaku0i2w0eo2.cloudfront.net/j40-cejst-2/pr-${{ needs.setup.outputs.destination-folder }}/en/#3/33.47/-97.5 !
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: preview-deployment
          mode: recreate
