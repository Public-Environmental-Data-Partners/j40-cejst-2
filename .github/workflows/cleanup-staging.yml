name: Cleanup Preview Deployment

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      - name: Delete All PR S3 Folders
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Deleting all S3 folders for PR #$PR_NUMBER"

          # List all folders that start with pr-{PR_NUMBER}-
          FOLDERS=$(aws s3 ls s3://pedp-cejst2-staging/j40-cejst-2/ --recursive | grep "pr-$PR_NUMBER-" | awk '{print $2}' | sed 's|/$||')

          if [ -z "$FOLDERS" ]; then
            echo "No folders found for PR #$PR_NUMBER"
          else
            echo "Found folders to delete:"
            echo "$FOLDERS"
            
            # Delete each folder
            for folder in $FOLDERS; do
              echo "Deleting: s3://pedp-cejst2-staging/j40-cejst-2/$folder/"
              aws s3 rm s3://pedp-cejst2-staging/j40-cejst-2/$folder/ --recursive
            done
            
            echo "✅ Successfully deleted all preview deployment folders for PR #$PR_NUMBER"
          fi

      - name: Invalidate CloudFront Cache for All PR Folders
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Invalidating CloudFront cache for all PR #$PR_NUMBER folders"

          # List all folders that start with pr-{PR_NUMBER}-
          FOLDERS=$(aws s3 ls s3://pedp-cejst2-staging/j40-cejst-2/ --recursive | grep "pr-$PR_NUMBER-" | awk '{print $2}' | sed 's|/$||')

          if [ -z "$FOLDERS" ]; then
            echo "No folders found for CloudFront invalidation"
          else
            # Create invalidation paths for all folders
            INVALIDATION_PATHS=""
            for folder in $FOLDERS; do
              INVALIDATION_PATHS="$INVALIDATION_PATHS /j40-cejst-2/$folder/*"
            done
            
            echo "Invalidating paths: $INVALIDATION_PATHS"
            aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths $INVALIDATION_PATHS
            echo "✅ Successfully invalidated CloudFront cache for all PR folders"
          fi

      - name: Comment on PR about cleanup
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            **🧹 Preview deployment cleaned up! 🧹**

            All preview deployment folders for this PR have been deleted from S3 and CloudFront cache has been invalidated.

            **Cleaned up PR**: #${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: cleanup-notification
