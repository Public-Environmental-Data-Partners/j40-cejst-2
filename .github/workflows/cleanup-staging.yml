name: Cleanup Preview Deployment

on:
  pull_request:
    types: [closed]
    paths:
      - "client/**/*"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      - name: Delete All PR S3 Folders
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Deleting S3 folders for PR #$PR_NUMBER"
          aws s3 rm s3://pedp-cejst2-staging/j40-cejst-2/ --exclude "*" --include "pr-$PR_NUMBER-*" --recursive

      - name: Comment on PR about cleanup
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            **🧹 Preview deployment cleaned up! 🧹**

            All preview deployment folders for this PR have been deleted from AWS.

            **Cleaned up PR**: #${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: cleanup-notification
